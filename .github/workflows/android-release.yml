name: Android release

# A manual run prepares signed artifacts. An android-v* tag additionally publishes them after the install check.
# Build code never receives signing secrets. Signing uses only runner tools and artifacts from the build job.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@v5

      - name: Check the release version
        id: version
        run: |
          v=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            test "${GITHUB_REF_NAME#android-v}" = "$v"
          fi

      - name: Test and build unsigned release packages
        run: |
          node scripts/gen-strings.mjs --check
          ./gradlew test lint bundleStandardRelease --console=plain
          mkdir -p ../release-unsigned
          for edition in full standard; do
            cp "app/build/outputs/apk/$edition/release/app-$edition-release-unsigned.apk" "../release-unsigned/$edition.apk"
            cp "app/build/outputs/mapping/${edition}Release/mapping.txt" "../release-unsigned/mapping-$edition.txt"
          done
          cp app/build/outputs/bundle/standardRelease/app-standard-release.aab ../release-unsigned/standard.aab

      - name: Verify native libraries support 16 KB devices
        run: |
          native="$(mktemp)"
          trap 'rm -f "$native"' EXIT
          for apk in ../release-unsigned/*.apk; do
            while IFS= read -r library; do
              unzip -p "$apk" "$library" > "$native"
              alignments="$(readelf -lW "$native" | awk '$1 == "LOAD" {print $NF}')"
              test -n "$alignments"
              for alignment in $alignments; do
                if (( alignment < 0x4000 )); then
                  echo "::error::$apk has an unaligned native library: $library ($alignment)"
                  exit 1
                fi
              done
            done < <(unzip -Z1 "$apk" | awk '/^lib\/(arm64-v8a|x86_64)\/.*\.so$/')
          done

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android
          path: release-unsigned/
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-android
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }

      - name: Sign and verify the release packages
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || {
            echo '::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD to the production signing key.'
            exit 1
          }
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore" aligned.apk' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unset KEYSTORE_BASE64
          bt="$(find "$ANDROID_HOME"/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir signed
          for edition in Standard Full; do
            apk="signed/Coumpanion-Android-$VERSION-$edition.apk"
            "$bt/zipalign" -P 16 -f 4 "${edition,,}.apk" aligned.apk
            "$bt/apksigner" sign --ks "$keystore" --ks-key-alias coucou \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" aligned.apk
            "$bt/zipalign" -c -P 16 4 "$apk"
            "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/$edition-certs.txt"
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/$edition-certs.txt"; then
              echo '::error::Release APKs require a production signing certificate.'
              exit 1
            fi
          done
          bundle="signed/Coumpanion-Android-$VERSION-Standard.aab"
          jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -signedjar "$bundle" standard.aab coucou
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/bundle-verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-verify.txt"
          cp mapping-*.txt signed/
          cd signed
          sha256sum ./*.apk > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}
          path: signed/
          if-no-files-found: error

  install:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}

      - name: Start Android 16 with 16 KB pages
        run: |
          sudo chmod a+rw /dev/kvm
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$sdk_tools/sdkmanager" ]]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
            test -n "$manager"
            sdk_tools="$(dirname "$manager")"
          fi
          image='system-images;android-36;google_apis_ps16k;x86_64'
          "$sdk_tools/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'emulator' "$image"
          echo no | "$sdk_tools/avdmanager" create avd -n coumpanion -k "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/emulator/emulator" -avd coumpanion -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]]; do sleep 2; done'
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          adb shell input keyevent 82

      - name: Install and launch both signed APKs
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum -c SHA256SUMS
          for edition in Standard Full; do
            app=app.coumpanion.android
            if [[ "$edition" = Standard ]]; then app+=.standard; fi
            apk="Coumpanion-Android-$VERSION-$edition.apk"
            adb install "$apk"
            adb install -r "$apk"
            adb shell am start -W -n "$app/com.coucou.android.MainActivity" | tee "$RUNNER_TEMP/launch.txt"
            grep -q 'Status: ok' "$RUNNER_TEMP/launch.txt"
            adb shell pidof "$app"
          done

  publish:
    needs: [build, install]
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="$VERSION"
          cat > release-notes.md <<EOF_NOTES
          Coumpanion — All your AI. One island.

          - **Standard** gives you local manual session tracking, the island and desktop pairing on Android 11 or later.
          - **Full** adds optional AI app notification access. Both editions track manual sessions on the phone without pairing or an account.
          - Check the APK downloads against the matching entries in \`SHA256SUMS\`.

          [Installation and upgrade guide](https://github.com/$GITHUB_REPOSITORY/blob/main/android/README.md)
          EOF_NOTES
          gh release create "$GITHUB_REF_NAME" "Coumpanion-Android-$v-Standard.apk" "Coumpanion-Android-$v-Full.apk" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Coumpanion $v" --notes-file release-notes.md --latest=false
