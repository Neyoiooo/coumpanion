name: Android release

# A manual run prepares signed artifacts or attaches them to an existing preview release.
# An android-v* tag publishes a stable release after the install check.
# Build code never receives signing secrets. Signing uses only runner tools and artifacts from the build job.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Completed Android release run with signed APKs to attach to a preview
        type: string
        required: false
      preview_number:
        description: Number of the existing preview release
        type: string
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.preview_run_id == ''
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@v5

      - name: Check the release version
        id: version
        run: |
          v=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            test "${GITHUB_REF_NAME#android-v}" = "$v"
          fi

      - name: Test and build unsigned release packages
        run: |
          node scripts/gen-strings.mjs --check
          ./gradlew test lint bundleStandardRelease --console=plain
          mkdir -p ../release-unsigned
          for edition in full standard; do
            cp "app/build/outputs/apk/$edition/release/app-$edition-release-unsigned.apk" "../release-unsigned/$edition.apk"
            cp "app/build/outputs/mapping/${edition}Release/mapping.txt" "../release-unsigned/mapping-$edition.txt"
          done
          cp app/build/outputs/bundle/standardRelease/app-standard-release.aab ../release-unsigned/standard.aab

      - name: Verify native libraries support 16 KB devices
        run: |
          native="$(mktemp)"
          trap 'rm -f "$native"' EXIT
          for apk in ../release-unsigned/*.apk; do
            while IFS= read -r library; do
              unzip -p "$apk" "$library" > "$native"
              alignments="$(readelf -lW "$native" | awk '$1 == "LOAD" {print $NF}')"
              test -n "$alignments"
              for alignment in $alignments; do
                if (( alignment < 0x4000 )); then
                  echo "::error::$apk has an unaligned native library: $library ($alignment)"
                  exit 1
                fi
              done
            done < <(unzip -Z1 "$apk" | awk '/^lib\/(arm64-v8a|x86_64)\/.*\.so$/')
          done

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android
          path: release-unsigned/
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-android
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }

      - name: Sign and verify the release packages
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || {
            echo '::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD to the production signing key.'
            exit 1
          }
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore" aligned.apk' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unset KEYSTORE_BASE64
          bt="$(find "$ANDROID_HOME"/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir signed
          for edition in Standard Full; do
            apk="signed/Coumpanion-Android-$VERSION-$edition.apk"
            "$bt/zipalign" -P 16 -f 4 "${edition,,}.apk" aligned.apk
            "$bt/apksigner" sign --ks "$keystore" --ks-key-alias coucou \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" aligned.apk
            "$bt/zipalign" -c -P 16 4 "$apk"
            "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/$edition-certs.txt"
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/$edition-certs.txt"; then
              echo '::error::Release APKs require a production signing certificate.'
              exit 1
            fi
          done
          bundle="signed/Coumpanion-Android-$VERSION-Standard.aab"
          jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -signedjar "$bundle" standard.aab coucou
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/bundle-verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-verify.txt"
          cp mapping-*.txt signed/
          cd signed
          sha256sum ./*.apk > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}
          path: signed/
          if-no-files-found: error

  install:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}

      - name: Start Android 16 with 16 KB pages
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$sdk_tools/sdkmanager" ]]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
            test -n "$manager"
            sdk_tools="$(dirname "$manager")"
          fi
          image='system-images;android-36;google_apis_ps16k;x86_64'
          "$sdk_tools/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'emulator' "$image"
          echo no | "$sdk_tools/avdmanager" create avd -n coumpanion -k "$image"
          adb="$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo 'ANDROID_SERIAL=emulator-5554' >> "$GITHUB_ENV"
          export ANDROID_SERIAL=emulator-5554
          "$adb" start-server
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -accel-check
          nohup "$emulator" -avd coumpanion -port 5554 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -no-metrics \
            < /dev/null > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 360))
          until [[ "$(timeout 5 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= deadline )); then
              "$adb" devices -l
              tail -100 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 3
          done
          test "$("$adb" shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          "$adb" shell input keyevent 82

      - name: Install and launch both signed APKs
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          if [[ "$VERSION" != 0.6.0 ]]; then
            gh release download coumpanion-v0.6.0-preview.1 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir baseline
            (
              cd baseline
              sha256sum -c <<'BASELINE'
          2e3c4ceb29d7b794fd646e831b9cbe26ea188c85b6cf9594c611288c427f8361  Coumpanion-Android-0.6.0-Full.apk
          eba69fb04a2ad90cfa1d6e8fd4bb8155d4c5f28257cfb143718e56dd0ebde2c1  Coumpanion-Android-0.6.0-Standard.apk
          BASELINE
            )
          fi
          launch() {
            local app="$1"
            adb shell am start -W -n "$app/com.coucou.android.MainActivity" | tee "$RUNNER_TEMP/launch.txt"
            grep -q 'Status: ok' "$RUNNER_TEMP/launch.txt"
            adb shell pidof "$app"
          }
          trap 'adb shell cmd power set-mode 0 || true; adb shell dumpsys battery reset || true' EXIT
          for edition in Standard Full; do
            app=app.coumpanion.android
            if [[ "$edition" = Standard ]]; then app+=.standard; fi
            apk="Coumpanion-Android-$VERSION-$edition.apk"
            adb install "$apk"
            adb install -r "$apk"
            launch "$app"
            adb shell input keyevent KEYCODE_HOME
            adb shell input keyevent KEYCODE_SLEEP
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent 82
            adb shell dumpsys battery unplug
            adb shell cmd power set-mode 1
            adb shell pm grant "$app" android.permission.POST_NOTIFICATIONS
            adb shell pm revoke "$app" android.permission.POST_NOTIFICATIONS
            adb shell am force-stop "$app"
            launch "$app"
            adb shell cmd power set-mode 0
            if [[ "$VERSION" != 0.6.0 ]]; then
              adb uninstall "$app"
              adb install "baseline/Coumpanion-Android-0.6.0-$edition.apk"
              adb install -r "$apk"
              launch "$app"
            fi
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-emulator-log
          path: ${{ runner.temp }}/emulator.log

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.preview_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach signed APKs to Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.preview_run_id }}
          PREVIEW_NUMBER: ${{ inputs.preview_number }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ && "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]
          run="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          head=$(gh api "$run" --jq '
            select(.status == "completed" and .event == "workflow_dispatch" and .head_branch == "main"
              and .path == ".github/workflows/android-release.yml" and .head_repository.id == .repository.id)
            | .head_sha')
          [[ "$head" =~ ^[a-f0-9]{40}$ ]]
          jobs=$(gh api "$run/jobs")
          jq -e '.jobs | any(.name == "build" and .conclusion == "success") and any(.name == "sign" and .conclusion == "success")' <<< "$jobs"
          artifact=$(gh api "$run/artifacts" --jq '
            [.artifacts[] | select(.expired == false and (.name | startswith("Coumpanion-Android-")))]
            | select(length == 1) | .[0].name')
          [[ "$artifact" =~ ^Coumpanion-Android-([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          tag="coumpanion-v$version-preview.$PREVIEW_NUMBER"
          tag_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          [[ "$tag_head" == "$head" ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease | jq -e '.isPrerelease'
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact"
          sha256sum -c SHA256SUMS
          gh release upload "$tag" \
            "Coumpanion-Android-$version-Standard.apk" "Coumpanion-Android-$version-Full.apk" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [build, install]
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Coumpanion-Android-${{ needs.build.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="$VERSION"
          cat > release-notes.md <<EOF_NOTES
          Coumpanion — All your AI. One island.

          - **Standard** gives you local manual session tracking, the island and desktop pairing on Android 11 or later.
          - **Full** adds optional AI app notification access. Both editions track manual sessions on the phone without pairing or an account.
          - Check the APK downloads against the matching entries in \`SHA256SUMS\`.

          [Installation and upgrade guide](https://github.com/$GITHUB_REPOSITORY/blob/main/android/README.md)
          EOF_NOTES
          gh release create "$GITHUB_REF_NAME" "Coumpanion-Android-$v-Standard.apk" "Coumpanion-Android-$v-Full.apk" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Coumpanion $v" --notes-file release-notes.md --latest=false
